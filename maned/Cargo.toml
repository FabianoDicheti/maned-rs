[package]
name = "maned"
version = "0.0.0"
edition = "2021"
rust-version = "1.65"
license = "Apache-2.0 OR MIT"
description = "Call .mnd scripts in-process (scaffold; not functional yet)"

[features]
default = ["json"]
json = []
tokio = ["dep:tokio"]

[dependencies]
maned-sys = { path = "../maned-sys" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"], optional = true }
