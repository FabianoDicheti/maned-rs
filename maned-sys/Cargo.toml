[package]
name = "maned-sys"
version = "0.4.0"
edition = "2021"
rust-version = "1.77"
links = "maned_c"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/FabianoDicheti/maned-rs"
homepage = "https://maned-lang.com"
documentation = "https://docs.rs/maned-sys"
readme = "../README.md"
description = "Raw FFI declarations for the mnd_* C ABI of libmaned_c"
# Windows is an explicit non-goal (MANEDRS_PLAN.md §5.12) — say so in the
# metadata, because an unanswered Windows issue reads as neglect rather than
# as a decision.
categories = ["external-ffi-bindings"]
keywords = ["maned", "ffi", "sys"]

[features]
default = []
# The docs.rs builder is sandboxed with no network and no library: build.rs
# short-circuits to no link directives so the API still renders (§4.5).
docsrs-stub = []
# Exists only so that asking for it produces the refusal in build.rs rather
# than a confusing linker error (§3.1). It never links anything.
static = []

[build-dependencies]
pkg-config = "0.3"

[package.metadata.docs.rs]
features = ["docsrs-stub"]
rustdoc-args = ["--cfg", "docsrs"]
